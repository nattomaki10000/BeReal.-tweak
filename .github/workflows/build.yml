name: Build BeRealCompatTweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install xz dpkg perl ldid

      - name: Set up Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" submodule update --init --recursive || true
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> "$GITHUB_ENV"
          echo "PERL5LIB=$HOME/theos/lib:$PERL5LIB" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin:$PATH" >> "$GITHUB_PATH"

      - name: Set up iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          ln -sf "$SDK_PATH" "$HOME/theos/sdks/iPhoneOS16.7.sdk" || true
          ls -la "$HOME/theos/sdks"

      - name: Build Package
        env:
          THEOS: ${{ env.THEOS }}
          THEOS_MAKE_PATH: ${{ env.THEOS_MAKE_PATH }}
          PERL5LIB: ${{ env.PERL5LIB }}
        run: |
          export THEOS=$HOME/theos
          export THEOS_MAKE_PATH=$HOME/theos/makefiles
          export PATH=$HOME/theos/bin:$PATH
          export PERL5LIB=$HOME/theos/lib:$PERL5LIB
          ls -l "$HOME/theos/bin/dm.pl"
          ls -l "$HOME/theos/vendor/dm.pl/dm.pl"
          make package FINALPACKAGE=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeRealCompatTweak-Build
          path: |
            .theos/obj/
            *.deb
