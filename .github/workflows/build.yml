name: Build BeRealCompatTweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install xz

      - name: Set up Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin:$PATH" >> "$GITHUB_PATH"

      - name: Set up iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ln -sf "$XCODE_SDK" "$HOME/theos/sdks/iPhoneOS16.7.sdk" || true

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeRealCompatTweak-Build
          path: |
            .theos/obj/
            *.deb
