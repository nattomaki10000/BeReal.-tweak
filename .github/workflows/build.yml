name: Build BeRealCompatTweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew update
          brew install make lzma xz

      - name: Set up Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Set up iOS SDK
        run: |
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Build Package
        run: |
          cd BeRealCompatTweak
          make package FINALPACKAGE=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeRealCompatTweak-Build
          path: |
            BeRealCompatTweak/.theos/obj/
            BeRealCompatTweak/*.deb
