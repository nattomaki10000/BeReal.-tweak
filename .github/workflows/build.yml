name: Build BeRealCompatTweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git perl dpkg-dev clang lzma xz-utils

      - name: Set up Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin:$PATH" >> "$GITHUB_PATH"
          echo "PERL5LIB=$HOME/theos/lib:$PERL5LIB" >> "$GITHUB_ENV"

      - name: Set up iPhone SDK path
        run: |
          mkdir -p "$HOME/theos/sdks"
          if [ -d /usr/share/iphoneos-sdk ]; then
            ln -sf /usr/share/iphoneos-sdk "$HOME/theos/sdks/iPhoneOS16.7.sdk" || true
          fi

      - name: Build Package
        env:
          THEOS: ${{ env.THEOS }}
          THEOS_MAKE_PATH: ${{ env.THEOS_MAKE_PATH }}
          PERL5LIB: ${{ env.PERL5LIB }}
        run: |
          export THEOS=$HOME/theos
          export THEOS_MAKE_PATH=$HOME/theos/makefiles
          export PATH=$HOME/theos/bin:$PATH
          export PERL5LIB=$HOME/theos/lib:$PERL5LIB
          make package FINALPACKAGE=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeRealCompatTweak-Build
          path: |
            .theos/obj/
            *.deb
